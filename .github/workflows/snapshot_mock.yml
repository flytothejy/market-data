name: snapshot-mock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy
      - run: python collect/snapshot_mock.py
      - name: push to mockup-data branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan mockup-data
          git rm -rq --cached .
          git add snapshot
          git commit -qm "mockup snapshot $(date -u +%F)"
          git push -f origin mockup-data
