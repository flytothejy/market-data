name: consensus

on:
  # 2026-10-20 예약 실행 중단: 허브가 전체 종목 컨센서스를 매일 쌓고(hub/consensus.py),
  # 예전 S&P 500 페이지 데이터도 허브 빌드가 만들어 Pages 배포 때 넣음(hub/consensus_page.py). 수동 실행만 남김
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용 종목 수 (0 = 전체)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas
      - name: collect
        run: python collect/consensus.py --limit ${{ inputs.limit || '0' }}
      - name: page
        if: always()
        run: python collect/consensus_page.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add consensus docs
          git diff --cached --quiet && exit 0
          git commit -m "consensus $(date -u +%F)"
          git pull --rebase -q || true
          git push
