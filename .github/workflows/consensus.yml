name: consensus

on:
  schedule:
    - cron: "30 2 * * 2-6"    # 화~토 02:30 UTC (한국 11:30) — 허브 수집(23:40 UTC~)과 야후 요청이 겹치지 않게
    # 허브가 전체 종목 컨센서스를 매일 쌓기 시작함(hub/consensus.py). 이 작업은 예전 S&P 500 페이지용으로만 유지
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용 종목 수 (0 = 전체)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas
      - name: collect
        run: python collect/consensus.py --limit ${{ inputs.limit || '0' }}
      - name: page
        if: always()
        run: python collect/consensus_page.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add consensus docs
          git diff --cached --quiet && exit 0
          git commit -m "consensus $(date -u +%F)"
          git pull --rebase -q || true
          git push
