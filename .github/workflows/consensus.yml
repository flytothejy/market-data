name: consensus

on:
  schedule:
    - cron: "10 0 * * 2-6"    # 화~토 00:10 UTC (한국 09:10) — 미국장 마감 후 하루 한 번
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용 종목 수 (0 = 전체)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas
      - name: collect
        run: python collect/consensus.py --limit ${{ inputs.limit || '0' }}
      - name: page
        if: always()
        run: python collect/consensus_page.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add consensus docs
          git diff --cached --quiet && exit 0
          git commit -m "consensus $(date -u +%F)"
          git pull --rebase -q || true
          git push
