name: hub

# 종목 허브 데이터 수집 — R2에서 받고 → 수집 → R2로 올림 (저장소에는 커밋하지 않음)
run-name: "hub ${{ github.event_name == 'workflow_dispatch' && inputs.set || (github.event.schedule == '0 2 * * 6' && 'weekly' || 'daily') }}"

# 주 실행은 Cloudflare Worker(cloudflare/trigger)가 정시에 workflow_dispatch로 깨움:
#   미국 동부 16:20 → close(종가·옵션·화면), 19:30 → daily(SEC·공매도·컨센서스 등 전부)
# 아래 깃허브 예약 실행은 Worker가 빠진 날을 위한 예비 (앞선 daily가 성공했으면 바로 끝냄)
on:
  schedule:
    - cron: "40 23 * * 1-5"   # 예비: 미국 동부 19:40 무렵 (깃허브는 자주 늦음)
    #   Worker daily와 겹치면 concurrency로 줄을 서고, 시작 시점엔 이미 끝나 있어 아래 점검에서 건너뜀
    # 예비 2회 더 (한국 11:30·13:30 화~토): Worker의 daily가 성공했으면 바로 끝냄
    # (미국 동부 23:30 전이라 컨센서스 날짜는 같은 거래일로 저장됨)
    - cron: "30 2 * * 2-6"
    - cron: "30 4 * * 2-6"
    - cron: "0 2 * * 6"       # 주 1회(토 11:00 한국): 개요·공매도 잔고·13F
  workflow_dispatch:
    inputs:
      set:
        description: "close · daily · weekly · 또는 수집기 이름(예: consensus)"
        default: "daily"

permissions:
  contents: read
  actions: read

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      SITE_URL: ${{ vars.SITE_URL || 'https://flytothejy.github.io/market-data' }}   # 홍보 카드에 찍히는 주소
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}   # 선택: 있으면 13F 종목 매핑이 10배 빠름 (openfigi.com 무료 키)
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-hub.txt
      - run: pip install -q -r requirements-hub.txt
      - name: skip if today's daily already done
        id: g
        run: |
          # 예비 예약 실행(23:40·02:30·04:30 UTC): 최근 10시간 안에 가격·화면 데이터가 이미 제대로 만들어졌으면 건너뜀
          # (깃허브 예약 실행이 몇 시간씩 늦게 도는 날이 있어, 손으로 먼저 돌린 뒤 늦게 온 예약 실행이 같은 일을 반복하지 않게)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 2 * * 6" ]; then
            python -m hub sync pull --only _status/
            python - <<'PY' >> $GITHUB_OUTPUT
          import json, datetime as dt, pathlib
          p = pathlib.Path("data/hub/_status")
          now = dt.datetime.now(dt.timezone.utc)
          def fresh(n):
              try:
                  r = json.loads((p / f"{n}.json").read_text(encoding="utf-8"))
                  return r.get("ok") and now - dt.datetime.fromisoformat(r["finished_utc"]) < dt.timedelta(hours=10)
              except Exception:
                  return False
          print("skip=1" if all(fresh(n) for n in ("prices", "consensus", "build")) else "skip=0")
          PY
          fi
      - name: which set
        if: steps.g.outputs.skip != '1'
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "set=${{ inputs.set }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 2 * * 6" ]; then echo "set=weekly" >> $GITHUB_OUTPUT
          else echo "set=daily" >> $GITHUB_OUTPUT; fi
      - name: browser for weekly cards
        if: steps.g.outputs.skip != '1' && (contains(steps.s.outputs.set, 'weekly') || contains(steps.s.outputs.set, 'cards'))
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: pull from R2
        if: steps.g.outputs.skip != '1'
        run: python -m hub sync pull
      - name: collect
        if: steps.g.outputs.skip != '1'
        continue-on-error: true
        run: python -m hub run ${{ steps.s.outputs.set }}
      - name: push to R2
        if: always() && steps.g.outputs.skip != '1'
        run: python -m hub sync push
      - name: notify
        if: always() && steps.g.outputs.skip != '1'
        run: python -m hub notify ${{ steps.s.outputs.set }}
