name: hub

# 종목 허브 데이터 수집 — R2에서 받고 → 수집 → R2로 올림 (저장소에는 커밋하지 않음)
on:
  schedule:
    - cron: "40 23 * * 1-5"   # 평일(미국 기준) 마감 후: 한국 08:40 화~토
    - cron: "0 2 * * 6"       # 주 1회(토 11:00 한국): 개요·공매도 잔고·13F
  workflow_dispatch:
    inputs:
      set:
        description: "daily · weekly · 또는 수집기 이름(예: consensus)"
        default: "daily"

permissions:
  contents: read

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-hub.txt
      - run: pip install -q -r requirements-hub.txt
      - name: which set
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "set=${{ inputs.set }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 2 * * 6" ]; then echo "set=weekly" >> $GITHUB_OUTPUT
          else echo "set=daily" >> $GITHUB_OUTPUT; fi
      - name: pull from R2
        run: python -m hub sync pull
      - name: collect
        continue-on-error: true
        run: python -m hub run ${{ steps.s.outputs.set }}
      - name: push to R2
        if: always()
        run: python -m hub sync push
      - name: notify
        if: always()
        run: python -m hub notify ${{ steps.s.outputs.set }}
