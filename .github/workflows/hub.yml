name: hub

# 종목 허브 데이터 수집 — R2에서 받고 → 수집 → R2로 올림 (저장소에는 커밋하지 않음)
run-name: "hub ${{ github.event_name == 'workflow_dispatch' && inputs.set || (github.event.schedule == '0 2 * * 6' && 'weekly' || 'daily') }}"

on:
  schedule:
    - cron: "40 23 * * 1-5"   # 평일(미국 기준) 마감 후: 한국 08:40 화~토
    # 예비: 깃허브 예약 실행은 몇 시간 늦거나 빠지기도 함 → 앞선 daily가 성공했으면 바로 끝냄
    # (미국 동부 23:30 전이라 컨센서스 날짜는 같은 거래일로 저장됨)
    - cron: "30 1 * * 2-6"
    - cron: "30 3 * * 2-6"
    - cron: "0 2 * * 6"       # 주 1회(토 11:00 한국): 개요·공매도 잔고·13F
  workflow_dispatch:
    inputs:
      set:
        description: "daily · weekly · 또는 수집기 이름(예: consensus)"
        default: "daily"

permissions:
  contents: read
  actions: read

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-hub.txt
      - run: pip install -q -r requirements-hub.txt
      - name: skip if today's daily already done
        id: g
        run: |
          # 예비 실행(01:30·03:30 UTC)만: 오늘 가격·화면 데이터가 이미 제대로 만들어졌으면 건너뜀
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "40 23 * * 1-5" ] && [ "${{ github.event.schedule }}" != "0 2 * * 6" ]; then
            python -m hub sync pull --only _status/
            python - <<'PY' >> $GITHUB_OUTPUT
          import json, datetime as dt, pathlib
          p = pathlib.Path("data/hub/_status")
          now = dt.datetime.now(dt.timezone.utc)
          def fresh(n):
              try:
                  r = json.loads((p / f"{n}.json").read_text(encoding="utf-8"))
                  return r.get("ok") and now - dt.datetime.fromisoformat(r["finished_utc"]) < dt.timedelta(hours=10)
              except Exception:
                  return False
          print("skip=1" if all(fresh(n) for n in ("prices", "consensus", "build")) else "skip=0")
          PY
          fi
      - name: which set
        if: steps.g.outputs.skip != '1'
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "set=${{ inputs.set }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 2 * * 6" ]; then echo "set=weekly" >> $GITHUB_OUTPUT
          else echo "set=daily" >> $GITHUB_OUTPUT; fi
      - name: pull from R2
        if: steps.g.outputs.skip != '1'
        run: python -m hub sync pull
      - name: collect
        if: steps.g.outputs.skip != '1'
        continue-on-error: true
        run: python -m hub run ${{ steps.s.outputs.set }}
      - name: push to R2
        if: always() && steps.g.outputs.skip != '1'
        run: python -m hub sync push
      - name: notify
        if: always() && steps.g.outputs.skip != '1'
        run: python -m hub notify ${{ steps.s.outputs.set }}
