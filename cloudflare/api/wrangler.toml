# 대시보드에서 붙여넣기로 만들었다면 이 파일은 기록용 (wrangler deploy로 올릴 때만 사용)
name = "tickermap-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "tickermap"
database_id = "<D1 화면의 Database ID>"

[vars]
SITE = "https://flytothejy.github.io/market-data/hub"
# 비밀값(Secret): BOT_TOKEN, ALERT_KEY — 대시보드에서 직접
