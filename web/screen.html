<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="미국 주식 1,035종목·ETF 159개를 컨센서스·재무·차트·공시·뉴스 지표로 걸러 찾는 한국어 종목 검색기.">
<title>티커맵 — 검색</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<style>
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:5px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px}
.presets .btn{font-size:12.5px}
th.sort.asc::after{content:' ▲';font-size:9px}
th.sort.desc::after{content:' ▼';font-size:9px}
#addf{display:none;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:10px}
#addf.on{display:flex}

/* AI 문장 검색 */
@property --ai-a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ai-spin{to{--ai-a:360deg}}
@keyframes ai-shine{to{background-position:200% 0}}
.ai-wrap{position:relative;border-radius:18px;padding:2px;margin-bottom:14px;isolation:isolate;
  background:conic-gradient(from var(--ai-a),#ff6b6b,#ffa94d,#ffd43b,#69db7c,#4dabf7,#9775fa,#f783ac,#ff6b6b);animation:ai-spin 5s linear infinite}
.ai-wrap::before{content:'';position:absolute;inset:4px;border-radius:18px;background:inherit;filter:blur(16px);opacity:.28;z-index:-1}
.ai{border-radius:16px;background:var(--card);padding:16px 16px 14px}
.ai-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-top svg{width:22px;height:22px;flex:none}
.ai-top b{font-size:15.5px;letter-spacing:-.01em}
.ai-tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:99px;color:#fff;background:linear-gradient(90deg,#ff7a59,#9775fa,#4dabf7)}
.ai-top .mut{margin-left:auto;font-size:12px}
.ai-row{display:flex;gap:8px;align-items:stretch}
.ai textarea{flex:1;font:inherit;font-size:15px;line-height:1.45;border:1px solid var(--line);border-radius:12px;padding:11px 13px;resize:none;background:var(--bg);color:var(--ink);min-height:48px;outline:none;transition:border-color .15s,box-shadow .15s}
.ai textarea:focus{border-color:#9775fa;box-shadow:0 0 0 3px rgba(151,117,250,.15)}
.ai .go{white-space:nowrap;padding:0 18px;border:0;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff7a59,#9775fa 55%,#4dabf7)}
.ai .go:disabled{opacity:.6;cursor:wait}
.ai .go svg{width:15px;height:15px}
.ai-ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ai-ex .btn{font-size:12.5px;background:var(--soft);border-color:transparent}
.ai-out{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
.ai-out.on{display:block}
.ai-h{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.ai-load{font-size:13.5px;font-weight:700;background:linear-gradient(90deg,var(--muted) 0%,#9775fa 25%,#ff7a59 50%,var(--muted) 75%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:ai-shine 1.4s linear infinite}
.ai-q{font-size:13.5px;margin-bottom:6px;line-height:1.6}
.ai-note{font-size:12.5px;line-height:1.6}
.ai-note .u{color:var(--warn)}
.chip.ai-c{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,#ff9f7a,#b197fc,#74c0fc) border-box;border:1px solid transparent}
@media (prefers-reduced-motion:reduce){.ai-wrap{animation:none}.ai-load{animation:none;color:var(--muted)}}
@media (max-width:640px){.ai-q{display:none}.ai-top .mut{display:none}.ai-row{flex-direction:column}.ai .go{justify-content:center;padding:11px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel" role="status" aria-label="불러오는 중"><i class="sk sk-h"></i><i class="sk sk-p"></i><div class="sk-grid"><i class="sk sk-c"></i><i class="sk sk-c"></i><i class="sk sk-c"></i></div><i class="sk sk-b"></i></div></div>
<script>
header('검색');
const COLS = {
  info: ['n', 'sec', 'mcap', 'px', 'r1d', 'r1y', 'pe', 'rev_g', 'c_ratio'],
  cons: ['n', 'mcap', 'c_n', 'c_ratio', 'c_up', 'c_dn', 'c_chg90', 'c_upside', 'c_buy', 'c_fpe', 'c_surp', 'c_next'],
  fin: ['n', 'mcap', 'rev', 'rev_g', 'rev_qg', 'gm', 'om', 'om_chg', 'nm', 'fcfy', 'roe', 'pe', 'ps', 'dy', 'shy'],
  tech: ['n', 'mcap', 'r1w', 'r1m', 'r3m', 'r1y', 'd200', 'rsi', 'hi52', 'vr', 'vol', 'sv', 'sv_chg', 'si', 'iv', 'pcr'],
  doc: ['n', 'mcap', 'ib', 'is', 'ibn', 'ib_last', 'k8', 'k8_last', 'f144', 'g13d', 'k10'],
  news: ['n', 'mcap', 'nw7', 'nw_last'],
  etf: ['n', 'grp', 'aum', 'exp', 'dy', 'r1m', 'r3m', 'rytd', 'r1y', 'd200', 'vol', 'iv'],
};
const EXTRA = { grp: ['분류', 'info', 'text'], fam: ['운용사', 'info', 'text'], aum: ['순자산', 'info', 'usd'], exp: ['총보수', 'info', 'pct2'] };
const PRESETS = [
  ['전망 상향 + 상승 추세', { c_ratio: [0.2, null], d200: [0, null], c_n: [5, null] }, 'cons'],
  ['고성장·흑자', { rev_g: [0.2, null], om: [0.1, null], mcap: [1e10, null] }, 'fin'],
  ['내부자 매수', { ib: [1e5, null] }, 'doc'],
  ['배당 + 주주환원', { dy: [0.03, null], shy: [0.05, null] }, 'fin'],
  ['52주 신고가 부근', { hi52: [-0.03, null], vr: [1.2, null] }, 'tech'],
  ['낙폭 과대', { hi52: [null, -0.3], rsi: [null, 35], mcap: [1e10, null] }, 'tech'],
  ['공매도 비중 높음', { sv: [0.55, null], mcap: [5e9, null] }, 'tech'],
  ['유명 투자자가 새로 산 종목', { g13_new: [1, null] }, 'tech', 'g13_new'],
  ['유명 투자자 매수 우위', { g13_chg: [2, null] }, 'tech', 'g13_chg'],
  ['ETF 편입 늘어난 종목', { etf_add: [1, null] }, 'tech', 'etf_add'],
];
let U, F, kind = qs('kind') === 'etf' ? 'etf' : 'stock', cat = qs('cat') || 'info', sortK = null, sortD = -1, shown = 100;
const filt = {};           // key → [min,max]
const dfilt = {};          // 날짜 조건 key → {past|next: 일수}
const efilt = {};          // 고른 값 조건 key → [값…] (업종·지수 말고)
const AIK = new Set();     // AI가 넣은 조건 (칩 색)
const DLAB = { gc: '골든크로스', c_next: '다음 실적 발표', er_d: '최근 실적 발표', ea_d: '최근 실적 발표', ib_last: '최근 내부자 매수', k10: '최근 10-K' };
const ENUM_LAB = { dz: v => ['보통', '주의', '높음', '매우 높음'][v] || v, dvc_m: v => v + '월', c_when: v => v };
let sector = qs('sec') || '', index = '', query = '';

const lab = k => (F[k] || {}).label || (EXTRA[k] || [k])[0];
const fm = k => (F[k] || {}).fmt || (EXTRA[k] || [])[2] || 'text';
const SIGNED = new Set(['r1d', 'r1w', 'r1m', 'r3m', 'r6m', 'r1y', 'rytd', 'r12_1', 'd50', 'd200', 'hi52', 'rev_g', 'rev_qg', 'ni_g', 'c_ratio', 'c_chg90', 'c_upside', 'c_surp', 'c_eps_g', 'c_rev_g']);
function cell(r, k) {
  const v = r[k];
  if (k === 'n') return `<td class="l nm sc-n" title="${esc(v)}">${esc(shortName(r) || v)}</td>`;
  if (k === 'sec') return `<td class="l mut">${secKo(v)}</td>`;
  if (k === 'grp' || k === 'k8_last' || k === 'nw_last') return `<td class="l nm mut">${esc(v || '-')}</td>`;
  if (SIGNED.has(k)) return `<td>${pctS(v)}</td>`;
  if (k === 'om_chg' || k === 'sv_chg') return `<td class="num ${cls(v)}">${v == null ? '-' : (v > 0 ? '+' : '') + (v * 100).toFixed(1) + '%p'}</td>`;
  return `<td class="num">${fmt(v, fm(k))}</td>`;
}
// 입력 단위: pct 지표는 % 숫자로, usd는 억 달러로
const unitOf = k => ['pct', 'pct2'].includes(fm(k)) ? '%' : fm(k) === 'usd' ? '억$' : '';
const toRaw = (k, x) => x === '' || x == null ? null : unitOf(k) === '%' ? +x / 100 : unitOf(k) === '억$' ? +x * 1e8 : +x;
const toIn = (k, v) => v == null ? '' : unitOf(k) === '%' ? +(v * 100).toFixed(2) : unitOf(k) === '억$' ? v / 1e8 : v;

function rows() {
  const q = query.toLowerCase();
  return U.rows.filter(r => r.k === kind
    && (!sector || r.sec === sector) && (!index || (r.idx || '').split(',').includes(index))
    && (!q || r.t.toLowerCase().startsWith(q) || (r.n || '').toLowerCase().includes(q))
    && Object.entries(filt).every(([k, [a, b]]) => r[k] != null && (a == null || (a === 0 ? r[k] > 0 : r[k] >= a)) && (b == null || (b === 0 ? r[k] < 0 : r[k] <= b)))
    && Object.entries(dfilt).every(([k, d]) => dateOk(r[k], d))
    && Object.entries(efilt).every(([k, vs]) => r[k] != null && vs.map(String).includes(String(r[k]))));
}
const TODAY = () => new Date().toISOString().slice(0, 10);
const dd = (a, b) => (Date.parse(a) - Date.parse(b)) / 864e5;
function dateOk(v, d) {
  if (!v || v === 'NaT') return false;
  if (d.past != null) return v <= U.asof && dd(U.asof, v) <= d.past;
  const base = TODAY() > U.asof ? TODAY() : U.asof;
  return v >= base && dd(v, base) <= d.next;
}

function rangeTxt(k, a, b) {
  if (a === 0 && b == null) return '> 0';
  if (b === 0 && a == null) return '< 0';
  return `${a != null ? '≥ ' + fmt(a, fm(k)) : ''}${a != null && b != null ? ' · ' : ''}${b != null ? '≤ ' + fmt(b, fm(k)) : ''}`;
}
function render() {
  const cols = kind === 'etf' ? COLS.etf : COLS[cat];
  let R = rows();
  const sk = sortK && cols.concat(['t']).includes(sortK) ? sortK : (kind === 'etf' ? 'aum' : 'mcap');
  R.sort((a, b) => { const x = a[sk], y = b[sk]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * (sortK ? sortD : -1); });
  $('#count').textContent = `${R.length.toLocaleString()}개`;
  const cc = k => `chip${AIK.has(k) ? ' ai-c' : ''}`;
  $('#chips').innerHTML = Object.entries(dfilt).map(([k, d]) => `<span class="${cc(k)}">${esc(DLAB[k] || lab(k))} ${d.past != null ? `최근 ${d.past}일 안` : `앞으로 ${d.next}일 안`}<button data-t="d" data-k="${k}" aria-label="삭제">×</button></span>`).join('')
    + Object.entries(efilt).map(([k, vs]) => `<span class="${cc(k)}">${esc(lab(k))} ${vs.map(v => esc((ENUM_LAB[k] || (x => x))(v))).join('·')}<button data-t="e" data-k="${k}" aria-label="삭제">×</button></span>`).join('')
    + Object.entries(filt).map(([k, [a, b]]) => `<span class="${cc(k)}">${esc(lab(k))} ${rangeTxt(k, a, b)}<button data-t="r" data-k="${k}" aria-label="삭제">×</button></span>`).join('');
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => { delete ({ d: dfilt, e: efilt, r: filt })[b.dataset.t][b.dataset.k]; AIK.delete(b.dataset.k); syncUrl(); render(); });
  $('#tbl').innerHTML = `<thead><tr><th class="sort ${sortK === 't' ? (sortD > 0 ? 'asc' : 'desc') : ''}" data-k="t">티커</th>${cols.map(k => `<th class="sort ${sortK === k ? (sortD > 0 ? 'asc' : 'desc') : ''} ${['n', 'sec', 'grp', 'k8_last', 'nw_last'].includes(k) ? 'l' : ''}" data-k="${k}">${esc(lab(k))}${tip(k)}</th>`).join('')}</tr></thead>
    <tbody>${R.slice(0, shown).map(r => `<tr><td><a href="${stockUrl(r.t)}"><b>${esc(r.t)}</b></a></td>${cols.map(k => cell(r, k)).join('')}</tr>`).join('')}</tbody>`;
  $('#tbl').querySelectorAll('th.sort').forEach(th => th.onclick = () => { const k = th.dataset.k; sortD = sortK === k ? -sortD : (k === 't' || k === 'n' ? 1 : -1); sortK = k; render(); });
  $('#more').style.display = R.length > shown ? '' : 'none';
  document.querySelectorAll('#cats .btn').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
  document.querySelectorAll('#kinds .btn').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
  $('#cats').style.display = kind === 'etf' ? 'none' : '';
  $('#presets').style.display = kind === 'etf' ? 'none' : '';
}

// AI 문장 검색 — AI는 문장을 조건으로 바꾸기만 함 (features/ai-screen/README.md). 예시는 미리 바꿔 둔 결과
const AI_EX = [
  { label: '실적 4분기 연속 상회 + 한 달 안 골든크로스', q: '최근 실적 서프라이즈가 4분기 연속이고 매출·순이익이 늘었으며, 한 달 안에 골든크로스가 난 종목',
    r: { conds: [{ k: 'c_beats', min: 4 }, { k: 'rev_up_q', min: 4 }, { k: 'ni_up_q', min: 4 }, { k: 'gc', past_days: 30 }],
      assumptions: ["'매출·순이익이 꾸준히 늘었다'는 최근 4개 분기 연속으로 작년 같은 분기보다 늘었는지로 봤어요"] } },
  { label: '이번 주 실적 발표하는 기술주', q: '이번 주에 실적 발표하는 기술주',
    r: { conds: [{ k: 'c_next', next_days: 7 }, { k: 'sec', in: ['Technology'] }], assumptions: ["'이번 주'는 오늘부터 7일 안으로 봤어요"] } },
  { label: '배당 4% 넘고 빚 적은 대형주', q: '배당 4% 넘고 빚 적은 대형주',
    r: { conds: [{ k: 'dy', min: 0.04 }, { k: 'de', max: 0.5 }, { k: 'mcap', min: 1e10 }],
      assumptions: ["'빚 적은'은 장기부채가 자본의 0.5배 이하로 봤어요", "'대형주'는 시가총액 100억 달러 이상으로 봤어요"] } },
];
const B64 = { enc: o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))))) };
let aiRes = null;
function clearAll() { [filt, dfilt, efilt].forEach(o => Object.keys(o).forEach(k => delete o[k])); AIK.clear(); sector = index = ''; }
function syncUrl() {
  const u = new URL(location.href);
  if (aiRes) u.searchParams.set('ai', B64.enc({ q: aiRes.q, r: { ...aiRes.r, conds: aiRes.r.conds.filter(c => AIK.has(c.k)) } })); else u.searchParams.delete('ai');
  history.replaceState(null, '', u);
}
// AI 결과 적용: 사전에 없는 key·형태가 틀린 조건은 버리고 '지원하지 않는 조건'으로 (Worker에서도 같은 검사)
function applyAI(q, r) {
  clearAll();
  const un = [...(r.unsupported || [])];
  for (const c of r.conds || []) {
    if (c.k === 'sec' && c.in) { sector = c.in[0]; AIK.add('sec'); continue; }
    if (c.k === 'idx' && c.in) { index = c.in[0]; AIK.add('idx'); continue; }
    if (!F[c.k]) { un.push(c.k); continue; }
    if (c.past_days != null || c.next_days != null) dfilt[c.k] = c.past_days != null ? { past: +c.past_days } : { next: +c.next_days };
    else if (c.in) efilt[c.k] = c.in;
    else if (c.is != null) efilt[c.k] = [c.is];
    else if (c.min != null || c.max != null) filt[c.k] = [c.min ?? null, c.max ?? null];
    else { un.push(c.k); continue; }
    AIK.add(c.k);
  }
  if (r.kind === 'etf' || r.kind === 'stock') kind = r.kind;
  const cats = (r.conds || []).map(c => (F[c.k] || {}).cat).filter(x => x && x !== 'info');
  if (cats.length) cat = cats[0];
  sortK = null; sortD = -1;
  if (r.sort && F[r.sort.k]) {
    sortK = r.sort.k; sortD = r.sort.dir === 'asc' ? 1 : -1;
    if (!COLS[cat].includes(sortK)) cat = Object.keys(COLS).find(c => c !== 'etf' && COLS[c].includes(sortK)) || cat;
  }
  aiRes = { q, r: { ...r, unsupported: un } };
  $('#sec').value = sector; $('#idx').value = index;
  showAI(); syncUrl(); render();
}
function condTxt(c) {
  if (c.k === 'sec') return '업종 ' + c.in.map(secKo).join('·');
  if (c.k === 'idx') return '지수 ' + c.in.join('·');
  if (c.past_days != null) return `${DLAB[c.k] || lab(c.k)} 최근 ${c.past_days}일 안`;
  if (c.next_days != null) return `${DLAB[c.k] || lab(c.k)} 앞으로 ${c.next_days}일 안`;
  if (c.in || c.is != null) return `${lab(c.k)} ${(c.in || [c.is]).map(v => (ENUM_LAB[c.k] || (x => x))(v)).join('·')}`;
  return `${lab(c.k)} ${rangeTxt(c.k, c.min ?? null, c.max ?? null)}`;
}
function showAI() {
  const o = $('#aiout'), r = aiRes.r;
  o.classList.add('on');
  o.innerHTML = `<div class="ai-h"><span>이렇게 이해했어요 · 아래 조건 칩에서 고치거나 지울 수 있어요</span><a href="#" id="aiclr">지우기</a></div>
    <div class="ai-q">${(r.conds || []).map(c => `<b>${esc(condTxt(c))}</b>`).join(' · ')}</div>
    <div class="ai-note">${(r.assumptions || []).map(x => `<div class="mut">· ${esc(x)}</div>`).join('')}${(r.unsupported || []).map(x => `<div class="u">· 아직 지원하지 않는 조건: ${esc(x)}</div>`).join('')}
    <div class="faint" style="margin-top:4px">AI는 문장을 조건으로 바꾸기만 해요. 종목은 조건에 맞는 데이터로만 걸러요.</div></div>`;
  $('#aiclr').onclick = e => { e.preventDefault(); clearAll(); aiRes = null; o.classList.remove('on'); $('#aiq').value = ''; $('#sec').value = $('#idx').value = ''; syncUrl(); render(); };
}
async function askAI(q) {
  q = (q || '').trim();
  if (!q) return $('#aiq').focus();
  const ex = AI_EX.find(e => e.q === q || e.label === q);
  const o = $('#aiout'), btn = $('#aigo');
  o.classList.add('on'); o.innerHTML = '<div class="ai-load">조건으로 바꾸는 중…</div>'; btn.disabled = true;
  try {
    if (ex) { await new Promise(res => setTimeout(res, 500)); return applyAI(ex.q, ex.r); }
    const r = await fetch(API_BASE + '/ai/screen', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ q }) });
    if (r.status === 404) throw new Error('soon');
    const j = await r.json();
    if (r.status === 429) { o.innerHTML = `<div class="ai-note">오늘 쓸 수 있는 횟수(${j.limit}회)를 다 썼어요. ${j.login ? '로그인하면 하루 30회까지 쓸 수 있어요.' : '내일 다시 써 보세요.'} 예시 문장은 계속 쓸 수 있어요.</div>`; return; }
    if (!r.ok) throw new Error(j.error || 'fail');
    if (j.refused) { o.innerHTML = `<div class="ai-note">${esc(j.refused)}</div>`; return; }
    if (!(j.conds || []).length) { o.innerHTML = `<div class="ai-note">조건을 찾지 못했어요.${(j.unsupported || []).length ? ` 아직 지원하지 않는 조건: ${esc(j.unsupported.join(', '))}.` : ''} 위의 예시처럼 숫자·기간이 들어간 조건으로 적어 보세요.</div>`; return; }
    applyAI(q, j);
  } catch (e) {
    o.innerHTML = `<div class="ai-note">${e.message === 'soon' || e instanceof TypeError ? '문장 검색은 곧 열려요. 지금은 위의 예시 문장을 눌러 보세요.' : esc(e.message === 'limit' ? '오늘 쓸 수 있는 횟수를 다 썼어요. 내일 다시 써 보세요.' : '이해하지 못했어요. 조건을 조금 더 구체적으로 적어 보세요.')}</div>`;
  } finally { btn.disabled = false; }
}

      <input class="f" id="fa" type="number" step="any" placeholder="최소" style="width:100px"><span class="mut">~</span><input class="f" id="fb" type="number" step="any" placeholder="최대" style="width:100px"><span class="mut s13" id="fu"></span>

  $('#sec').value = sector;

  $('#aigo').onclick = () => askAI($('#aiq').value);

  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { const e = AI_EX[+b.dataset.ex]; $('#aiq').value = e.q; askAI(e.q); });
  if (qs('ai')) { try { const a = B64.dec(qs('ai')); $('#aiq').value = a.q || ''; applyAI(a.q, a.r); } catch (e) { } }
  render();
  footer();
})();
