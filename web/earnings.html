<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="미국 주식 실적 발표 달력 — 이번 주·다음 주 발표 종목, 옵션이 예상하는 변동폭과 과거 발표 때 실제 주가 변동을 한국어로.">
<title>티커맵 — 실적 달력</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<style>
.day{display:flex;flex-direction:column;gap:6px}
.day h3{display:flex;align-items:baseline;gap:8px}
.day h3 .mut{font-weight:400;font-size:12.5px}
.ratio{font-size:11px;padding:1px 6px;border-radius:99px;white-space:nowrap}
.ratio.hi{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.ratio.lo{background:color-mix(in srgb,var(--dn) 14%,transparent);color:var(--dn)}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-nav b{font-size:17px;min-width:110px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cal .hd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.cal .c{border:1px solid var(--line2);border-radius:10px;padding:6px 7px;min-height:96px;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:inherit;min-width:0}
.cal .c:hover{border-color:var(--line)}
.cal .c.out{opacity:.35}
.cal .c.past{background:var(--soft)}
.cal .c.today{background:color-mix(in srgb,var(--accent) 9%,var(--card));border-color:var(--accent)}
.cal .c.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cal .c .dn{display:flex;gap:6px;align-items:baseline;font-size:12.5px}
.cal .c .dn b{font-size:14px}
.cal .c .td{font-size:11px;font-weight:700;color:var(--accent)}
.cal .c .n{color:var(--muted);font-size:11.5px;margin-left:auto}
.cal .c .tk{display:flex;gap:4px;align-items:baseline;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden}
.cal .c .tk b{font-weight:650}
.cal .c .tk.mine b{color:var(--accent)}
.cal .c .tk i{font-style:normal;color:var(--faint);font-size:11px}
.cal .c .tk em{font-style:normal;font-size:11px;margin-left:auto;font-weight:600}
.cal .c .tk em.faint{font-weight:400}
.cal .c .more{font-size:11px;color:var(--faint)}
@media (max-width:640px){.cal{gap:3px}.cal .c{min-height:70px;padding:4px 3px;border-radius:7px}.cal .c .tk:nth-of-type(n+4){display:none}.cal .c .tk{font-size:10.5px}.cal .c .tk i,.cal .c .tk em{display:none}.cal .c .n{font-size:10px}.cal .c .td{display:none}.cal-nav .seg{margin-left:0!important;width:100%}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel" role="status" aria-label="불러오는 중"><i class="sk sk-h"></i><i class="sk sk-p"></i><div class="sk-grid"><i class="sk sk-c"></i><i class="sk sk-c"></i><i class="sk sk-c"></i></div><i class="sk sk-b"></i></div></div>
<script>
header('실적 달력');
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
// 미국 동부 기준 오늘
const nyToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = s => new Date(s + 'T12:00:00Z').getUTCDay();
const state = { scope: qs('scope') || 'all', mon: qs('mon') || null, sel: qs('d') || null };
// 미국 동부 지금 (분 단위) — 오늘 발표가 이미 나왔는지 (장 전 9:30, 장 후 16:05 기준)
const nyMin = () => { const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date()); const g = k => +p.find(x => x.type === k).value; return (g('hour') % 24) * 60 + g('minute'); };
// 발표 결과 한 단어 (EPS 우선, 매출과 엇갈리면 '엇갈림')
function verdict(r) {
  const L = (x, c) => x == null ? null : x > c ? 1 : x < -c ? -1 : 0, a = L(r.er_eps_s, 0.02), b = L(r.er_rev_s, 0.01), k = a ?? b;
  if (k == null) return null;
  const t = (a != null && b != null && a !== b) ? '엇갈림' : k > 0 ? '상회' : k < 0 ? '하회' : '부합';
  return { t, c: t === '상회' ? 'up' : t === '하회' ? 'dn' : 'mut' };
}

function ratioTag(r) {
  if (!r.er_imp || !r.er_avg) return '';
  const x = r.er_imp / r.er_avg;
  if (x > 1.5) return `<span class="ratio hi" title="옵션 예상 변동폭이 과거 평균의 ${x.toFixed(1)}배">평소보다 큼</span>`;
  if (x < 0.8) return `<span class="ratio lo" title="옵션 예상 변동폭이 과거 평균의 ${x.toFixed(1)}배">평소보다 작음</span>`;
  return '';
}

function render(U) {
  const today = nyToday(), now = nyMin(), wd = dow(today);
  const firstOpen = wd === 6 ? addDays(today, 2) : wd === 0 ? addDays(today, 1) : today;       // 주말이면 다음 월요일
  if (!state.sel) state.sel = firstOpen;
  if (!state.mon) state.mon = state.sel.slice(0, 7);
  const mFirst = state.mon + '-01';
  const gStart = addDays(mFirst, -((dow(mFirst) + 6) % 7));                                    // 달력 첫 칸(월요일)
  const [yy, mm] = state.mon.split('-').map(Number);
  const mEnd = addDays(`${mm === 12 ? yy + 1 : yy}-${String(mm === 12 ? 1 : mm + 1).padStart(2, '0')}-01`, -1);
  const gEnd = addDays(mEnd, (5 - dow(mEnd) + 7) % 7);                                          // 마지막 칸(금요일)
  const watch = new Set(Watch.list()), hold = new Set(portfolioTickers()), mine = new Set([...watch, ...hold]);
  const scopes = { all: ['전체', () => true], big: ['시가총액 100억 달러 이상', r => (r.mcap || 0) >= 1e10], watch: [`관심 종목 ${watch.size}`, r => watch.has(r.t)], hold: [`포트폴리오 ${hold.size}`, r => hold.has(r.t)] };
  const inScope = (scopes[state.scope] || scopes.all)[1];
  const stocks = U.rows.filter(r => r.k === 'stock' && inScope(r));
  // 오늘 발표가 이미 나왔나: 데이터(최근 발표일) 또는 시각
  const doneToday = r => (r.ea_d || r.er_d) === today || (r.c_when === '장 전' && now >= 570) || (r.c_when === '장 후' && now >= 965);
  // 날짜별: 앞으로(다음 발표일) + 지난(최근 발표일)
  const cnt = {};
  stocks.forEach(r => {
    if (r.c_next && r.c_next >= gStart && r.c_next <= gEnd) (cnt[r.c_next] = cnt[r.c_next] || []).push(r);
    const ed = r.ea_d || r.er_d;
    if (ed && ed >= gStart && ed <= gEnd && ed !== r.c_next && ed <= today) (cnt[ed] = cnt[ed] || []).push({ ...r, _done: 1 });
  });
  const chip = (r, d) => {
    if (r._done || (d === today && doneToday(r))) { const v = verdict(r); return v && (r.ea_d || r.er_d) === d ? `<em class="${v.c}">${v.t}</em>` : d === today ? '<em class="mut">발표함</em>' : ''; }
    const mv = r.er_imp || r.er_avg;
    return mv ? `<em class="faint">±${(mv * 100).toFixed(mv < 0.1 ? 1 : 0)}%</em>` : '';
  };
  const when = r => r.c_when === '장 전' ? '전' : r.c_when === '장 후' ? '후' : '';
  const mvm = k => { const d = new Date(Date.UTC(yy, mm - 1 + k, 1)); return d.toISOString().slice(0, 7); };
  let cells = '';
  for (let d = gStart; d <= gEnd; d = addDays(d, 1)) {
    const w = dow(d); if (w === 0 || w === 6) continue;
    const xs = (cnt[d] || []).sort((a, b) => (mine.has(b.t) - mine.has(a.t)) || ((b.mcap || 0) - (a.mcap || 0)));
    cells += `<button class="c ${d.slice(0, 7) !== state.mon ? 'out' : ''} ${d < today ? 'past' : ''} ${d === firstOpen ? 'today' : ''} ${d === state.sel ? 'sel' : ''}" data-day="${d}">
      <span class="dn"><b>${+d.slice(8)}</b>${d === firstOpen ? `<span class="td">${d === today ? '오늘' : '다음 거래일'}</span>` : ''}${xs.length ? `<span class="n">${xs.length}개</span>` : ''}</span>
      ${xs.slice(0, 4).map(r => `<span class="tk ${mine.has(r.t) ? 'mine' : ''}" title="${esc(r.ko || r.n || '')}"><b>${esc(r.t)}</b>${!r._done && when(r) && !(d === today && doneToday(r)) ? `<i>${when(r)}</i>` : ''}${chip(r, d)}</span>`).join('')}
      ${xs.length > 4 ? `<span class="more">+${xs.length - 4}</span>` : ''}</button>`;
  }
  let h = `<div class="hero"><h1>실적 발표 달력</h1><p>미국 날짜 기준 (장 후 발표는 한국 시간으로 다음 날 새벽) · 다음 발표일은 회사 발표나 예상치(매주 갱신)</p></div>`;
  h += `<div class="card" style="gap:10px"><div class="cal-nav"><button class="btn" data-mon="${mvm(-1)}" aria-label="이전 달">‹</button><b>${yy}년 ${mm}월</b><button class="btn" data-mon="${mvm(1)}" aria-label="다음 달">›</button>
      ${state.mon !== today.slice(0, 7) ? `<button class="btn" data-mon="${today.slice(0, 7)}" data-go="${firstOpen}">오늘</button>` : ''}
      <span class="seg" style="margin-left:auto">${Object.entries(scopes).map(([k, [l]]) => `<button class="btn ${k === state.scope ? 'on' : ''}" data-scope="${k}">${esc(l)}</button>`).join('')}</span></div>
    <div class="cal">${['월', '화', '수', '목', '금'].map(x => `<div class="hd">${x}</div>`).join('')}${cells}</div>
    <div class="small mut">발표 전: 전·후 = 장 전·장 후 발표, ±% = 예상 변동폭(옵션, 없으면 지난 8번 평균) · 발표 뒤: 애널리스트 예상 대비 결과 · 관심·포트폴리오 종목은 색으로</div></div>`;

  // 고른 날 목록
  const d = state.sel, past = d < today, isToday = d === today;
  const up = stocks.filter(r => r.c_next === d).sort((a, b) => (b.mcap || 0) - (a.mcap || 0));
  const done = stocks.filter(r => (r.ea_d || r.er_d) === d && r.c_next !== d).sort((a, b) => (b.mcap || 0) - (a.mcap || 0));
  const head = `${d.slice(5).replace('-', '월 ')}일 (${DOW[dow(d)]})${isToday ? ' <span class="tag">오늘</span>' : d === firstOpen ? ' <span class="tag">다음 거래일</span>' : ''}`;
  const N = 30, cut = (xs, k) => state['all' + k] ? xs : xs.slice(0, N), more = (xs, k) => xs.length > N ? `<button class="btn" data-more="${k}" style="align-self:flex-start">${state['all' + k] ? '접기' : `${xs.length - N}개 더 보기`}</button>` : '';
  if (done.length) {
    h += `<div class="card day"><h3>${head} 발표 결과<span class="mut">${done.length}개 · 예상 = 발표 전날까지 애널리스트 평균</span></h3>
      <div class="tbl-wrap"><table class="t"><thead><tr><th></th><th class="l">종목</th><th>결과</th><th>EPS</th><th>매출</th><th>주가 반응</th><th>지난 8번 평균${tip('er_avg')}</th><th>다음 분기 매출 전망</th></tr></thead><tbody>
      ${cut(done, 'd').map(r => { const v = verdict(r); const has = (r.er_d === d); return `<tr><td style="width:30px">${starBtn(r.t)}</td><td class="l nm"><a href="${stockUrl(r.t)}"><b>${esc(r.t)}</b></a> <span class="mut small">${esc((r.ko || r.n || '').slice(0, 16))}</span>${hold.has(r.t) ? ' <span class="tag">포트폴리오</span>' : ''}</td>
        <td>${has && v ? `<span class="${v.c}">예상 ${v.t}</span>` : '<span class="faint">-</span>'}</td><td>${has ? pctS(r.er_eps_s) : '-'}</td><td>${has ? pctS(r.er_rev_s) : '-'}</td><td>${has ? pctS(r.er_mv) : '-'}</td><td class="num mut">${r.er_avg != null ? '±' + fmt(r.er_avg, 'pct') : '-'}</td><td>${has ? pctS(r.er_nq) : '-'}</td></tr>`; }).join('')}
      </tbody></table></div>${more(done, 'd')}${done.some(r => r.er_d !== d) ? '<div class="small faint">결과 숫자는 발표 뒤 75일 동안, 컨센서스를 받는 종목만 보여요</div>' : ''}</div>`;
  }
  if (up.length || !done.length) {
    h += `<div class="card day"><h3>${head}${past ? ' 발표 예정이었던 종목' : ' 발표 예정'}<span class="mut">${up.length}개${past ? ' · 결과는 다음 갱신 때 반영' : ''}</span></h3>
      ${up.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th></th><th class="l">종목</th><th>시점</th>${isToday ? '<th>지금</th>' : ''}<th>시가총액</th><th>옵션 예상 변동${tip('er_imp')}</th><th>지난 8번 평균${tip('er_avg')}</th><th>같은 업종 이번 시즌${tip('em_ind')}</th><th></th><th>직전 서프라이즈${tip('c_surp')}</th><th>4분기 상회${tip('c_beats')}</th><th>전망 순상향률${tip('c_ratio')}</th><th>1개월</th></tr></thead><tbody>
      ${cut(up, 'u').map(r => `<tr><td style="width:30px">${starBtn(r.t)}</td><td class="l nm"><a href="${stockUrl(r.t)}"><b>${esc(r.t)}</b></a> <span class="mut small">${esc((r.n || '').slice(0, 22))}</span>${hold.has(r.t) ? ' <span class="tag">포트폴리오</span>' : ''}</td>
        <td>${r.c_when || (r.c_est ? '<span class="faint">예상일</span>' : '-')}</td>${isToday ? `<td>${doneToday(r) ? '<b>발표함</b>' : r.c_when ? '<span class="mut">발표 전</span>' : '<span class="faint">-</span>'}</td>` : ''}<td class="num">${fmtUsd(r.mcap)}</td>
        <td class="num">${r.er_imp != null ? '±' + fmt(r.er_imp, 'pct') : '-'}</td><td class="num">${r.er_avg != null ? '±' + fmt(r.er_avg, 'pct') : '-'}</td><td class="num">${r.em_ind != null ? '±' + fmt(r.em_ind, 'pct') + (r.em_all ? '<span class="faint small"> 전체</span>' : '') : '-'}</td><td>${ratioTag(r)}</td>
        <td>${pctS(r.c_surp)}</td><td class="num">${r.c_beats != null ? r.c_beats + '/4' : '-'}</td><td>${pctS(r.c_ratio)}</td><td>${pctS(r.r1m)}</td></tr>`).join('')}
      </tbody></table></div>${more(up, 'u')}` : `<div class="mut s13">${state.scope === 'all' ? '' : esc(scopes[state.scope][0].replace(/ \d+$/, '')) + ' 중 '}이날 실적을 발표하는 종목이 없어요.${state.scope === 'watch' && !watch.size ? ' 종목 화면에서 ☆를 눌러 관심 종목에 담아 보세요.' : ''}</div>`}</div>`;
  }
  // 주목: 앞으로 2주 안, 옵션 시장이 평소보다 큰 움직임을 예상하는 종목
  const hot = stocks.filter(r => r.c_next && r.c_next >= today && r.c_next <= addDays(today, 14) && r.er_imp && r.er_avg).map(r => ({ ...r, x: r.er_imp / r.er_avg })).sort((a, b) => b.x - a.x).slice(0, 6);
  if (hot.length >= 2) {
    h += `<div class="card"><h3>옵션 시장이 평소보다 크게 움직일 거라 보는 종목 <span class="mut">앞으로 2주</span></h3><div class="sub">옵션 예상 변동폭 ÷ 지난 8번 평균${tip('er_imp')}</div>
      <div class="rank">${hot.map((r, i) => `<a class="r" href="${stockUrl(r.t)}"><span class="i num">${i + 1}</span><span class="nm"><b>${esc(r.t)}</b><small>${esc(r.c_next.slice(5))} ${r.c_when || ''} · 예상 ±${fmt(r.er_imp, 'pct')} / 평소 ±${fmt(r.er_avg, 'pct')}</small></span><span class="v num">${r.x.toFixed(1)}배</span></a>`).join('')}</div></div>`;
  }
  h += `<div class="small faint">옵션 예상 변동폭은 옵션을 수집하는 시가총액 상위 종목만, 발표 후 7일 안에 끝나는 옵션 만기가 있을 때(보통 발표 주간) 계산합니다 · 지난 8번 평균은 실적 발표 반응일(장 전 발표는 그날, 장 후 발표는 다음 거래일)의 S&P 500 대비 움직임, 방향 무시</div>`;
  $('#app').innerHTML = h;
  document.querySelectorAll('[data-mon]').forEach(b => b.onclick = () => { state.mon = b.dataset.mon; if (b.dataset.go) state.sel = b.dataset.go; sync(); render(U); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { state.sel = b.dataset.day; state.alld = state.allu = false; if (state.sel.slice(0, 7) !== state.mon) state.mon = state.sel.slice(0, 7); sync(); render(U); setTimeout(() => { const t = document.querySelector('.card.day'); if (t && innerWidth < 900) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); });
  document.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { state.scope = b.dataset.scope; sync(); render(U); });
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { state['all' + b.dataset.more] = !state['all' + b.dataset.more]; render(U); });
  footer();
}
function sync() { const u = new URL(location.href); u.searchParams.delete('range'); u.searchParams.set('scope', state.scope); u.searchParams.set('mon', state.mon); u.searchParams.set('d', state.sel); history.replaceState(null, '', u); }

(async () => {
  try { const U = await Data.universe(); render(U); document.addEventListener('watch-change', () => { if (state.scope === 'watch') render(U); }); }
  catch (e) { $('#app').innerHTML = `<div class="loading">불러오지 못했습니다 (${esc(e.message)})</div>`; }
})();
</script>
</body>
</html>
