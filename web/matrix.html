<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="어긋남 지도 — 주가와 애널리스트 전망·매출 성장·유명 투자자·내부자·공매도가 반대로 움직인 미국 주식을 한 장의 지도로.">
<title>어긋남 지도 — 종목 허브</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<style>
.mx-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mx-seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px;flex-wrap:wrap}
.mx-seg button{font:inherit;font-size:13.5px;min-height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.mx-seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mx-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.mx-wrap{grid-template-columns:minmax(0,1fr)}}
.mx-chart{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mx-chart svg{display:block;width:100%;user-select:none}
.mx-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;white-space:nowrap;z-index:5;display:none}
.mx-bar{position:absolute;right:12px;top:10px;display:flex;gap:6px;z-index:4}
.mx-bar .btn{min-height:32px;font-size:12.5px;padding:4px 10px}
.mx-side{display:flex;flex-direction:column;gap:12px}
.mx-list a{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line2);color:var(--ink);font-size:13.5px;cursor:pointer}
.mx-list a:first-of-type{border-top:0}
.mx-list a.g{grid-template-columns:minmax(0,1fr) auto}
.mx-list a.g small{display:none}
.mx-list a:hover{background:var(--soft);text-decoration:none}
.mx-list small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-list .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{cursor:pointer}
#mx-svg{touch-action:pan-y;cursor:grab}
.mx-more summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:4px 0;list-style:none}
.mx-more summary::before{content:'▸ '}
.mx-more[open] summary::before{content:'▾ '}
.mx-more[open] summary{margin-bottom:8px}
@media (min-width:700px){.mx-more summary{display:none}}
#mx-svg:active{cursor:grabbing}
.mx-find{position:relative}
.mx-find input{width:260px}
@media (max-width:600px){.mx-find,.mx-find input{width:100%}}
.mx-sugg{position:absolute;left:0;top:42px;width:300px;max-width:calc(100vw - 48px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;display:none;z-index:30}
.mx-sugg a{display:flex;gap:10px;padding:8px 12px;color:var(--ink);align-items:baseline;cursor:pointer}
.mx-sugg a:hover,.mx-sugg a.sel{background:var(--soft);text-decoration:none}
.mx-sugg b{min-width:56px}
.mx-sugg span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--card)}
.mx-chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mx-chip button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;min-width:26px;min-height:26px}
.qbg{cursor:zoom-in}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">불러오는 중…</div></div>
<script src="assets/matrix.js"></script>
</body>
</html>
